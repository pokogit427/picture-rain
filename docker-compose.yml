services:
  db:
    image: postgres:16-alpine
    container_name: picture-rain-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picture_rain}
      POSTGRES_USER: ${POSTGRES_USER:-picture_rain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picture_rain_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: picture-rain-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-picture_rain}:${POSTGRES_PASSWORD:-picture_rain_dev}@db:5432/${POSTGRES_DB:-picture_rain}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/processed:/app/data/processed
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
